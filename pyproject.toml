[project]
name = "fitness-ledger"
version = "0.1.0"
description = "Volume-per-muscle-group training ledger over Hevy and Google Health"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    # Protocol client only -- talks to Gemini, Groq and Ollama alike via their
    # OpenAI-compatible endpoints. See llm.py.
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# The planning coach only. Deliberately optional: ADK pulls 25 direct
# dependencies and nothing else here needs them -- the dashboard, sync, CLI and
# chat dock all work without it, and a clone that never plans shouldn't carry
# the weight. See src/fitness_ledger/coach/.
coach = ["google-adk>=2.6"]

[project.scripts]
ledger = "fitness_ledger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fitness_ledger = ["web/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
