[project]
name = "fitness-ledger"
version = "0.1.0"
description = "Volume-per-muscle-group training ledger over Hevy and Google Health"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ledger = "fitness_ledger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fitness_ledger = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
